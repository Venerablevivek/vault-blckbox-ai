services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filesharing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filesharing}
      POSTGRES_DB: ${POSTGRES_DB:-filesharing}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filesharing} -d ${POSTGRES_DB:-filesharing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API (browsers fetch presigned download URLs from here)
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-filesharing}:${POSTGRES_PASSWORD:-filesharing}@postgres:5432/${POSTGRES_DB:-filesharing}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fs_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      SHARE_DEFAULT_TTL_HOURS: ${SHARE_DEFAULT_TTL_HOURS:-168}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-168}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-60}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-dev-only-pepper-change-me}
      EXPOSE_INVITE_LINKS: ${EXPOSE_INVITE_LINKS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Only the web container may set X-Forwarded-For. Its address is pinned below.
      TRUSTED_PROXIES: 10.203.14.10
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side rewrite target. The browser only ever talks to the web origin,
      # so the session cookie is same-origin and there is no CORS to configure.
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        # Fixed so the API can trust exactly this address as its proxy (TRUSTED_PROXIES).
        ipv4_address: 10.203.14.10

networks:
  default:
    ipam:
      config:
        - subnet: 10.203.14.0/24

volumes:
  postgres-data:
  minio-data:
