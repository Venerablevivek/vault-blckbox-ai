x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  API_PORT: 4000
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  # The API and worker connect as vault_app, a least-privilege role created by the migrate service:
  # no DDL, no TRUNCATE, no changes to the audit trail, and subject to row-level security.
  # COMPOSE_* names, not DATABASE_URL, so a DATABASE_URL in .env meant for running outside Docker
  # (localhost) never leaks into the containers.
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://vault_app:${APP_DB_PASSWORD:-dev-only-app-password}@postgres:5432/${POSTGRES_DB:-filesharing}}
  # Migrations run once, in the migrate service, as the database owner.
  MIGRATE_ON_START: 'false'
  # Set both when DATABASE_URL goes through PgBouncer (see the pgbouncer service below).
  DATABASE_DIRECT_URL: ${COMPOSE_DATABASE_DIRECT_URL:-}
  DATABASE_READ_URL: ${COMPOSE_DATABASE_READ_URL:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fs_session}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-documents}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  SHARE_DEFAULT_TTL_HOURS: ${SHARE_DEFAULT_TTL_HOURS:-168}
  INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-168}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-60}
  IP_HASH_PEPPER: ${IP_HASH_PEPPER:-dev-only-pepper-change-me}
  SHARE_GRANT_SECRET: ${SHARE_GRANT_SECRET:-dev-only-share-grant-secret-change-me}
  MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
  ARCHIVE_MAX_FILES: ${ARCHIVE_MAX_FILES:-1000}
  ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-5368709120}
  MAX_CONCURRENT_ARCHIVES: ${MAX_CONCURRENT_ARCHIVES:-4}
  SHARE_WATERMARK_MAX_BYTES: ${SHARE_WATERMARK_MAX_BYTES:-52428800}
  DOCUMENT_MAX_VERSIONS: ${DOCUMENT_MAX_VERSIONS:-20}
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
  LOGIN_LOCKOUT_ATTEMPTS: ${LOGIN_LOCKOUT_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-60}
  MAX_DIRECT_UPLOAD_BYTES: ${MAX_DIRECT_UPLOAD_BYTES:-5368709120}
  UPLOAD_SESSION_TTL_HOURS: ${UPLOAD_SESSION_TTL_HOURS:-24}
  UPLOAD_PART_URL_TTL_SECONDS: ${UPLOAD_PART_URL_TTL_SECONDS:-3600}
  SHARE_EVENT_RETENTION_MONTHS: ${SHARE_EVENT_RETENTION_MONTHS:-13}
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
  NOTIFICATION_STREAM_HEARTBEAT_SECONDS: ${NOTIFICATION_STREAM_HEARTBEAT_SECONDS:-15}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Vault <no-reply@vault.local>}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
  EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-required}
  # Malware scanning: off unless the antivirus profile is running (see the clamav service).
  SCAN_MODE: ${SCAN_MODE:-off}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-104857600}
  # Thumbnails and search text are made by the worker. Office previews: off unless the office
  # profile is running (see the gotenberg service).
  PROCESSING_MAX_BYTES: ${PROCESSING_MAX_BYTES:-52428800}
  OFFICE_PREVIEWS: ${OFFICE_PREVIEWS:-off}
  GOTENBERG_URL: http://gotenberg:3000
  WEBHOOK_ALLOW_INSECURE: ${WEBHOOK_ALLOW_INSECURE:-false}
  WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
  # Metrics on 9464 (compose network only). Tracing is off unless an OTLP endpoint is set, as the
  # observability profile does: OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  METRICS_PORT: 9464
  # Only for load tests from a single machine (see loadtest/vault.js). An empty value would turn it off.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  EXPOSE_INVITE_LINKS: ${EXPOSE_INVITE_LINKS:-true}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filesharing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filesharing}
      POSTGRES_DB: ${POSTGRES_DB:-filesharing}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-filesharing} -d ${POSTGRES_DB:-filesharing}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Browsers PUT upload parts straight to storage; only the web app's origin may do so.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_URL:-http://localhost:3000}
    ports:
      - '9000:9000' # S3 API (browsers fetch presigned download URLs from here)
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15

  # Development mail server: catches every email the app sends. Inbox at http://localhost:8025.
  # In production, point SMTP_URL at a real provider instead.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '8025:8025' # inbox web UI
      - '1025:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: vault-api
      # Only the web container may set X-Forwarded-For. Its address is pinned below.
      TRUSTED_PROXIES: 10.203.14.10
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Malware scanning for uploads (optional: needs about 1 GB of memory and downloads virus
  # signatures on first start). Enable with:
  #   SCAN_MODE=clamav docker compose --profile antivirus up -d
  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: ['antivirus']
    environment:
      # Must be at least SCAN_MAX_BYTES: clamd rejects longer streams.
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

  # Office previews (optional): LibreOffice in its own container turns Office files into PDFs the
  # worker can preview, thumbnail and index. Its browser and webhook features are switched off,
  # so it can't be made to fetch anything. Enable with:
  #   OFFICE_PREVIEWS=gotenberg docker compose --profile office up -d
  gotenberg:
    image: gotenberg/gotenberg:8.24.0@sha256:b116a40a1c24917e2bf3e153692da5acd2e78e7cd67e1b2d243b47c178f31c90
    profiles: ['office']
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --api-timeout=60s
      - --libreoffice-auto-start=true
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Metrics and traces (optional). Prometheus scrapes the API and worker; Jaeger receives traces
  # over OTLP and shows them at http://localhost:16686. Enable with:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ['observability']
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'

  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    profiles: ['observability']
    ports:
      - '127.0.0.1:16686:16686'

  # Applies migrations as the database owner, then creates/updates the vault_app role and its
  # privileges. Runs to completion before the API and worker start; they never see owner credentials.
  migrate:
    build:
      context: ./apps/api
    command: ['node', 'dist/migrate-cli.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-filesharing}:${POSTGRES_PASSWORD:-filesharing}@postgres:5432/${POSTGRES_DB:-filesharing}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-filesharing}:${POSTGRES_PASSWORD:-filesharing}@postgres:5432/${POSTGRES_DB:-filesharing}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-app-password}
      # Required by config validation; the migrate command doesn't use storage.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Optional connection pooler for many API/worker replicas. Off by default; to use it:
  #   COMPOSE_DATABASE_URL=postgres://vault_app:dev-only-app-password@pgbouncer:5432/filesharing \
  #   COMPOSE_DATABASE_DIRECT_URL=postgres://vault_app:dev-only-app-password@postgres:5432/filesharing \
  #   docker compose --profile pgbouncer up -d
  # Transaction pooling can't carry sessions, so LISTEN, advisory locks and migrations use
  # DATABASE_DIRECT_URL. Statement timeouts are enforced here, since PgBouncer drops the
  # per-connection statement_timeout the API would otherwise set.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    profiles: ['pgbouncer']
    environment:
      # PgBouncer authenticates clients against this user: the application role.
      DATABASE_URL: postgres://vault_app:${APP_DB_PASSWORD:-dev-only-app-password}@postgres:5432/${POSTGRES_DB:-filesharing}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 20
      QUERY_TIMEOUT: 15
      IDLE_TRANSACTION_TIMEOUT: 30
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout
    ports:
      - '6432:5432' # inside the Compose network it is pgbouncer:5432
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs: email, notification fan-out, checksums, workspace purges and scheduled
  # maintenance. Same image as the API. Scale with `docker compose up --scale worker=3`.
  worker:
    build:
      context: ./apps/api
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: vault-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side rewrite target. The browser only ever talks to the web origin,
      # so the session cookie is same-origin and there is no CORS to configure.
      API_INTERNAL_URL: http://api:4000
      # Allowed in the Content-Security-Policy for previews served from object storage.
      STORAGE_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        # Fixed so the API can trust exactly this address as its proxy (TRUSTED_PROXIES).
        ipv4_address: 10.203.14.10

networks:
  default:
    ipam:
      config:
        - subnet: 10.203.14.0/24

volumes:
  postgres-data:
  minio-data:
  clamav-data:
