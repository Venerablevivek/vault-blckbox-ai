name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  api:
    name: API · lint, typecheck, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Start Postgres and MinIO
        working-directory: .
        run: docker compose up -d --wait postgres minio
      # Unit, integration, security and contract tests against real Postgres and MinIO. The
      # contract tests also fail if openapi.json is out of date.
      - run: npm test
      - name: Dependency audit (all dependencies, including dev tools)
        run: npm audit --audit-level=moderate

  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api-schema.d.ts || (echo "::error::Run 'npm run api:types' in apps/web and commit the result" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (all dependencies, including dev tools)
        run: npm audit --audit-level=moderate

  images:
    name: Images · build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t vault-api:ci apps/api
          docker build -t vault-web:ci --build-arg API_INTERNAL_URL=http://api:4000 apps/web
      # Fails on HIGH or CRITICAL vulnerabilities that have a fix available, in OS packages or
      # bundled dependencies.
      - name: Scan the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: End-to-end · full stack in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build and start the stack
        run: |
          docker compose up -d --build --wait
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/login -o /dev/null && exit 0; sleep 2; done
          echo "web did not become ready" && exit 1
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
